services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_RAPIDAPI_KEY: ${VITE_RAPIDAPI_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - app

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-fitplanner};User=${MYSQL_USER:-fitplanner};Password=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-FitPlanner.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-FitPlanner.Pwa}
      Admin__Email: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      Cors__Origins__0: ${FRONTEND_URL:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - app
      - data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fitplanner}
      MYSQL_USER: ${MYSQL_USER:-fitplanner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - data

volumes:
  mysql_data:

networks:
  app:
    internal: true
  data:
    internal: true
